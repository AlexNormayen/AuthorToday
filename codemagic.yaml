# Codemagic CI — unsigned Sideloadly IPA + App Store / TestFlight signed workflow.
#
# Secrets (set in Codemagic UI → Environment variables, NOT in this file):
#   CHITALNYA_PUBLISH_TOKEN, CHITALNYA_SSH_KEY_B64
#   CHITALNYA_VPS_HOST, CHITALNYA_SSH_USER (optional overrides)
# App Store signed workflow also needs:
#   DEVELOPMENT_TEAM = Team ID (Membership)
# Optional TestFlight: App Store Connect API key integration / APP_STORE_APPLE_ID
workflows:
  ios-unsigned-ipa:
    name: AuthorToday iOS IPA (unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: AuthorToday.xcodeproj
        XCODE_SCHEME: AuthorToday
        CHITALNYA_PUBLISH_URL: https://tv.theinquisitor.ru/chitalnya/api/publish
        CHITALNYA_VPS_HOST: "185.125.103.168"
        CHITALNYA_SSH_USER: chitalnya-publish
        # CHITALNYA_PUBLISH_TOKEN and CHITALNYA_SSH_KEY_B64 — Codemagic encrypted env only
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    when:
      changeset:
        includes:
          - "AuthorToday/**"
          - "AuthorToday.xcodeproj/**"
          - "codemagic.yaml"
        excludes:
          - "**/*.md"
          - "docs/**"
    scripts:
      - name: Show Xcode
        script: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -list -project "$XCODE_PROJECT"

      - name: Build without code signing
        script: |
          set -euo pipefail
          set -x
          set -o pipefail
          LOG="$CM_BUILD_DIR/xcodebuild.log"
          # Do not hide xcodebuild exit code behind tee
          set +e
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$CM_BUILD_DIR/DerivedData" \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            CURRENT_PROJECT_VERSION="${PROJECT_BUILD_NUMBER:-1}" \
            INFOPLIST_KEY_ChitalnyaDistribution=sideload \
            build 2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          set -e
          echo "==== xcodebuild errors (if any) ===="
          grep -E "error:|fatal error:|❌|unable to type-check|SwiftCompile" "$LOG" | tail -n 120 || true
          if [ "$STATUS" -ne 0 ]; then
            echo "xcodebuild failed with status $STATUS"
            exit "$STATUS"
          fi

      - name: Package AuthorToday.ipa
        script: |
          set -euo pipefail
          APP=$(find "$CM_BUILD_DIR/DerivedData/Build/Products" -name "AuthorToday.app" -type d | head -n 1)
          if [ -z "$APP" ]; then
            echo "AuthorToday.app not found"
            find "$CM_BUILD_DIR/DerivedData/Build/Products" -maxdepth 4 -type d || true
            exit 1
          fi
          echo "Packaging: $APP"
          # Align CFBundleVersion / publish id with meta.json (b{BUILD}-{commit}).
          PLIST="$APP/Info.plist"
          BUILD_NUM="${PROJECT_BUILD_NUMBER:-}"
          COMMIT_SHORT="$(printf '%s' "${CM_COMMIT:-}" | cut -c1-7)"
          if [ -n "$BUILD_NUM" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" "$PLIST" \
              || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUM" "$PLIST"
          fi
          if [ -n "$BUILD_NUM" ] && [ -n "$COMMIT_SHORT" ]; then
            PUB_ID="b${BUILD_NUM}-${COMMIT_SHORT}"
            /usr/libexec/PlistBuddy -c "Set :ChitalnyaPublishId $PUB_ID" "$PLIST" \
              || /usr/libexec/PlistBuddy -c "Add :ChitalnyaPublishId string $PUB_ID" "$PLIST"
            echo "Stamped ChitalnyaPublishId=$PUB_ID"
          fi
          /usr/libexec/PlistBuddy -c "Set :ChitalnyaDistribution sideload" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :ChitalnyaDistribution string sideload" "$PLIST"
          STAGE="$CM_BUILD_DIR/ipa_stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP" "$STAGE/Payload/"
          (
            cd "$STAGE"
            zip -qry "$CM_BUILD_DIR/AuthorToday.ipa" Payload
          )
          ls -lh "$CM_BUILD_DIR/AuthorToday.ipa"
          touch ~/SUCCESS

    artifacts:
      - AuthorToday.ipa
      - DerivedData/**/*.app
      - /tmp/xcodebuild_logs/*.log

    publishing:
      scripts:
        - name: Publish IPA to install page
          script: |
            set -euo pipefail
            if [ ! -f ~/SUCCESS ]; then
              echo "Build did not succeed — skip VPS publish"
              exit 0
            fi
            IPA="$CM_BUILD_DIR/AuthorToday.ipa"
            if [ ! -f "$IPA" ]; then
              echo "AuthorToday.ipa missing — skip VPS publish"
              exit 0
            fi
            COMMIT_SHORT="$(printf '%s' "${CM_COMMIT:-}" | cut -c1-7)"
            echo "Publishing AuthorToday.ipa to install page…"
            ls -lh "$IPA"

            publish_ok=0
            HOST="${CHITALNYA_VPS_HOST:-185.125.103.168}"
            USER="${CHITALNYA_SSH_USER:-chitalnya-publish}"

            # 1) SSH :22 via restricted publish user (reliable from CodeMagic).
            if [ -n "${CHITALNYA_SSH_KEY_B64:-}" ]; then
              KEY=/tmp/chitalnya_publish_key
              printf '%s' "$CHITALNYA_SSH_KEY_B64" | base64 -d > "$KEY"
              chmod 600 "$KEY"
              if cat "$IPA" | ssh -i "$KEY" -o StrictHostKeyChecking=accept-new \
                  -o ConnectTimeout=30 -o ServerAliveInterval=15 \
                  "${USER}@${HOST}" \
                  "publish chitalnya ${PROJECT_BUILD_NUMBER:-} ${COMMIT_SHORT} ${CM_BRANCH:-}"
              then
                publish_ok=1
              else
                echo "SSH publish failed — will try HTTPS"
              fi
              rm -f "$KEY"
            else
              echo "CHITALNYA_SSH_KEY_B64 not set in Codemagic env — skip SSH publish"
            fi

            # 2) HTTPS fallback (may time out from CodeMagic → RU VPS).
            if [ "$publish_ok" -ne 1 ]; then
              if [ -z "${CHITALNYA_PUBLISH_TOKEN:-}" ]; then
                echo "CHITALNYA_PUBLISH_TOKEN not set — skip HTTPS publish"
              elif curl -fL --connect-timeout 20 --max-time 90 \
                  --retry 2 --retry-delay 2 \
                  --resolve "tv.theinquisitor.ru:443:${HOST}" \
                  -X POST "$CHITALNYA_PUBLISH_URL" \
                  -H "Authorization: Bearer $CHITALNYA_PUBLISH_TOKEN" \
                  -F "app=chitalnya" \
                  -F "buildNumber=${PROJECT_BUILD_NUMBER:-}" \
                  -F "commit=${COMMIT_SHORT}" \
                  -F "branch=${CM_BRANCH:-}" \
                  -F "ipa=@${IPA};filename=AuthorToday.ipa;type=application/octet-stream"
              then
                publish_ok=1
              fi
            fi

            if [ "$publish_ok" -eq 1 ]; then
              echo "Published: https://tv.theinquisitor.ru/chitalnya/"
            else
              echo "WARNING: auto-publish failed. IPA is still in Codemagic Artifacts."
              echo "Ensure CHITALNYA_SSH_KEY_B64 / CHITALNYA_PUBLISH_TOKEN are set in Codemagic UI."
              exit 0
            fi

  # App Store / TestFlight — Developer Program + Team ID required.
  # Codemagic UI → Environment variables for this workflow:
  #   DEVELOPMENT_TEAM = 57FVB8DUWX
  # Optional: App Store Connect API key integration for TestFlight upload.
  # Identifiers (Developer portal):
  #   ru.chitalnya.reader
  #   ru.chitalnya.reader.ContinueReadingWidget
  #   App Group group.ru.chitalnya.reader on both
  #   In-App Purchase on main App ID
  ios-app-store-signed:
    name: Читальня App Store (signed)
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      groups:
        - app_store  # UI/API: DEVELOPMENT_TEAM=57FVB8DUWX
      ios_signing:
        distribution_type: app_store
        # String only — Codemagic also matches extensions (e.g. …ContinueReadingWidget).
        bundle_identifier: ru.chitalnya.reader
      vars:
        XCODE_PROJECT: AuthorToday.xcodeproj
        XCODE_SCHEME: AuthorToday
    scripts:
      - name: Prepare App Store Info.plist (HTTPS only)
        script: |
          set -euo pipefail
          # Strip cleartext ATS exceptions used only for sideload VPS fallbacks.
          PLIST="$CM_BUILD_DIR/AuthorToday/Info.plist"
          if [ -f "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$PLIST" || true
            echo "Removed NSAppTransportSecurity from Info.plist for App Store build"
          fi

      - name: Set up code signing
        script: |
          set -euo pipefail
          xcode-project use-profiles
          # Fetch profiles for main app + widget when available
          echo "Expected bundles: ru.chitalnya.reader , ru.chitalnya.reader.ContinueReadingWidget"
          echo "App Group: group.ru.chitalnya.reader"

      - name: Build signed archive
        script: |
          set -euo pipefail
          if [ -z "${DEVELOPMENT_TEAM:-}" ]; then
            echo "DEVELOPMENT_TEAM is empty."
            echo "Add it in Codemagic → Environment variables for this workflow (Team ID)."
            echo "See docs/app-store.md"
            echo "For Sideloadly IPA use workflow: AuthorToday iOS IPA (unsigned)"
            exit 1
          fi
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$CM_BUILD_DIR/Chitalnya.xcarchive" \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CURRENT_PROJECT_VERSION="${PROJECT_BUILD_NUMBER:-2}" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="APPSTORE" \
            INFOPLIST_KEY_ChitalnyaDistribution=appstore \
            PRODUCT_BUNDLE_IDENTIFIER=ru.chitalnya.reader \
            archive

      - name: Export IPA
        script: |
          set -euo pipefail
          cat > "$CM_BUILD_DIR/ExportOptions.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
            <key>teamID</key>
            <string>TEAM_ID_PLACEHOLDER</string>
          </dict>
          </plist>
          EOF
          # Strip leading spaces from indented heredoc so plist is valid
          sed -i '' 's/^[[:space:]]*//' "$CM_BUILD_DIR/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Set :teamID $DEVELOPMENT_TEAM" "$CM_BUILD_DIR/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/Chitalnya.xcarchive" \
            -exportOptionsPlist "$CM_BUILD_DIR/ExportOptions.plist" \
            -exportPath "$CM_BUILD_DIR/export"
          cp "$CM_BUILD_DIR"/export/*.ipa "$CM_BUILD_DIR/Chitalnya.ipa"
          ls -lh "$CM_BUILD_DIR/Chitalnya.ipa"
          # Sanity: channel stamp
          unzip -l "$CM_BUILD_DIR/Chitalnya.ipa" | head -n 40 || true

      - name: Upload to TestFlight (optional)
        script: |
          set -euo pipefail
          if [ -z "${APP_STORE_CONNECT_ISSUER_ID:-}${APP_STORE_CONNECT_KEY_IDENTIFIER:-}" ] && [ -z "${APP_STORE_APPLE_ID:-}" ]; then
            echo "Skipping TestFlight upload — configure App Store Connect API key in Codemagic,"
            echo "then enable publishing below or upload Chitalnya.ipa via Transporter."
            exit 0
          fi
          app-store-connect publish \
            --path "$CM_BUILD_DIR/Chitalnya.ipa" \
            --beta-build-localizations="locale=ru-RU,whatsNew=Читальня: подготовка к Review" || \
          echo "Publish skipped/failed — upload IPA manually with Transporter."

    artifacts:
      - Chitalnya.ipa
      - Chitalnya.xcarchive
