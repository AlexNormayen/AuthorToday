# Publishes IPA to https://tv.theinquisitor.ru/chitalnya/
# Prefer SSH (port 22) — CodeMagic→VPS :443 is flaky from some regions.
#
# Triggers:
# - workflow_dispatch (manual / Codemagic litterbox URL)
# - release (Codemagic native GitHub release publishing)
# - repository_dispatch type publish-ipa

name: Publish IPA to install page

on:
  workflow_dispatch:
    inputs:
      app:
        description: chitalnya or tubevault
        required: true
        default: chitalnya
      artifact_url:
        description: Direct URL to the .ipa file
        required: false
        default: ""
      build_number:
        description: CodeMagic build number
        required: false
        default: ""
      commit:
        description: Short commit SHA
        required: false
        default: ""
      branch:
        description: Branch name
        required: false
        default: ""
  release:
    types: [published, prereleased]
  repository_dispatch:
    types: [publish-ipa]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve inputs
        id: meta
        run: |
          set -euo pipefail
          APP="chitalnya"
          URL=""
          BUILD=""
          COMMIT=""
          BRANCH=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            APP="${{ inputs.app }}"
            URL="${{ inputs.artifact_url }}"
            BUILD="${{ inputs.build_number }}"
            COMMIT="${{ inputs.commit }}"
            BRANCH="${{ inputs.branch }}"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            APP='${{ github.event.client_payload.app }}'
            URL='${{ github.event.client_payload.artifact_url }}'
            BUILD='${{ github.event.client_payload.build_number }}'
            COMMIT='${{ github.event.client_payload.commit }}'
            BRANCH='${{ github.event.client_payload.branch }}'
            APP="${APP:-chitalnya}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            APP="chitalnya"
            BUILD="${{ github.event.release.tag_name }}"
            BRANCH="${{ github.event.release.target_commitish }}"
          fi
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Download IPA (URL)
        if: steps.meta.outputs.url != ''
        run: |
          set -euo pipefail
          curl -fL --retry 5 --connect-timeout 30 --max-time 300 -o app.ipa "${{ steps.meta.outputs.url }}"
          file app.ipa
          test -s app.ipa

      - name: Download IPA (GitHub Release asset)
        if: steps.meta.outputs.url == '' && github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" \
            -p "*.ipa" -D .
          IPA=$(ls -1 *.ipa | head -n 1)
          test -n "$IPA"
          mv "$IPA" app.ipa
          ls -lh app.ipa

      - name: Publish via SSH to VPS
        env:
          SSH_KEY: ${{ secrets.CHITALNYA_SSH_KEY }}
          VPS_HOST: ${{ secrets.CHITALNYA_VPS_HOST }}
          TOKEN: ${{ secrets.CHITALNYA_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          test -f app.ipa
          APP="${{ steps.meta.outputs.app }}"
          BUILD="${{ steps.meta.outputs.build }}"
          COMMIT="${{ steps.meta.outputs.commit }}"
          BRANCH="${{ steps.meta.outputs.branch }}"
          HOST="${VPS_HOST:-185.125.103.168}"

          if [ -n "${SSH_KEY:-}" ]; then
            KEY=/tmp/chitalnya_key
            printf '%s\n' "$SSH_KEY" > "$KEY"
            chmod 600 "$KEY"
            REMOTE="/tmp/app-${GITHUB_RUN_ID}.ipa"
            scp -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -i "$KEY" \
              app.ipa "root@${HOST}:${REMOTE}"
            ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -i "$KEY" \
              "root@${HOST}" \
              "/opt/chitalnya/publish-local.sh '${APP}' '${REMOTE}' '${BUILD}' '${COMMIT}' '${BRANCH}' && rm -f '${REMOTE}'"
            rm -f "$KEY"
            echo "Published via SSH"
            exit 0
          fi

          echo "No SSH key — HTTPS fallback"
          test -n "${TOKEN:-}"
          FNAME="AuthorToday.ipa"
          if [ "$APP" = "tubevault" ]; then FNAME="TubeVault.ipa"; fi
          curl -fL --retry 3 --connect-timeout 30 --max-time 180 \
            -X POST "https://tv.theinquisitor.ru/chitalnya/api/publish" \
            -H "Authorization: Bearer $TOKEN" \
            -F "app=${APP}" \
            -F "buildNumber=${BUILD}" \
            -F "commit=${COMMIT}" \
            -F "branch=${BRANCH}" \
            -F "ipa=@app.ipa;filename=${FNAME};type=application/octet-stream"
          echo
          echo "Published via HTTPS"
